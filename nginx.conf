# Include this file from the parent http {} context (for example, conf.d).
# TLS must terminate before this server block; configure HSTS at that TLS terminator.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 20m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    # Same-origin is the default. Do not add wildcard CORS headers here.
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The application trusts only this local proxy; never pass a client-supplied
    # forwarding chain through as an authenticated source address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This platform identity header is trusted by the SDK. It must only be set
    # by a separately authenticated upstream, never accepted from the client.
    proxy_set_header X-Larkgw-Suda-Webuser "";
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Deny normalized requests for hidden files and common accidental backups.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:bak|backup|env|ini|log|old|sql|sqlite|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Source maps may reveal original client source even if emitted by a future build.
    location ~* \.map$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # The bundled generic forwarder has no target allow-list and must stay
    # unreachable until replaced by an explicitly authenticated implementation.
    location ^~ /api/__platform__/http-forward {
        return 404;
    }

    location /api/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/v1/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        limit_conn conn_limit 30;
        proxy_pass http://127.0.0.1:3000;
    }

    # The Nest application serves dist/client. Proxy assets instead of using an
    # unspecified Nginx document root, while retaining long-lived cache headers.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
